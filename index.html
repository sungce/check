<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 진도 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sb:#0f172a;--sb-w:228px;--bg:#f1f5f9;--white:#fff;
  --accent:#6366f1;--accent-lt:#eef2ff;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --border:#e2e8f0;--sh:0 1px 3px rgba(0,0,0,.08);
  --sh-md:0 4px 12px rgba(0,0,0,.1);--r:12px;
  --g1:#0ea5e9;--g2:#8b5cf6;--g3:#f97316;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px}
/* ── Sidebar ── */
.sb{width:var(--sb-w);background:var(--sb);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100}
.sb-head{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-name{font-size:13.5px;font-weight:700;color:#fff;line-height:1.2}
.logo-sub{font-size:11px;color:rgba(255,255,255,.35);font-weight:400;margin-top:1px}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-section{margin-bottom:4px}
.nav-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;color:rgba(255,255,255,.25);text-transform:uppercase;padding:8px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;color:rgba(255,255,255,.5);font-size:13.5px;font-weight:500;border-radius:8px;transition:all .15s;margin:1px 0}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-icon{width:18px;text-align:center;font-size:15px}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.25);font-size:11px;font-family:'JetBrains Mono',monospace}
/* ── Main ── */
.main{margin-left:var(--sb-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tb-title{font-size:18px;font-weight:700}
.tb-sub{font-size:12px;color:var(--text3);margin-top:2px}
.tb-acts{display:flex;gap:8px}
.content{padding:24px 28px;flex:1}
/* ── Views ── */
.view{display:none}
.view.active{display:block;animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#4f46e5}
.btn-secondary{background:var(--white);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid transparent}.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:#fef2f2;color:#ef4444;border:1px solid #fecaca}.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
/* ── Card ── */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}
.card-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600}
.card-body{padding:20px}
/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px}
.stat-num{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1}
.stat-lbl{font-size:12px;color:var(--text3);margin-top:4px}
/* ── Class Grid ── */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.class-card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:all .2s}
.class-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--accent)}
.cc-head{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between}
.cc-badge{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.g1{background:var(--g1)}.g2{background:var(--g2)}.g3{background:var(--g3)}
.cc-body{padding:0 16px 14px}
.cc-name{font-size:15px;font-weight:700;margin:6px 0 10px}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px;font-family:'JetBrains Mono',monospace}
.prog-wrap{background:#f1f5f9;border-radius:99px;height:6px;overflow:hidden;margin-bottom:10px}
.prog-bar{height:100%;border-radius:99px;background:var(--accent);transition:width .6s cubic-bezier(.34,1.2,.64,1)}
.cc-lesson{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}
.cc-unit{font-size:11.5px;color:var(--text3);margin-top:2px}
.cc-memo{font-size:11px;color:var(--text3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-date{font-size:11px;color:var(--text3);margin-top:6px;font-family:'JetBrains Mono',monospace}
.no-prog{font-size:13px;color:var(--text3);font-style:italic;line-height:1.6}
/* ── Badge ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-blue{background:#eff6ff;color:#3b82f6}
.badge-green{background:#f0fdf4;color:#10b981}
.badge-amber{background:#fffbeb;color:#f59e0b}
.badge-gray{background:#f1f5f9;color:#94a3b8}
.badge-red{background:#fef2f2;color:#ef4444}
/* ── Grade Filter ── */
.gf{display:flex;gap:8px;margin-bottom:18px}
.gc{padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:var(--white);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
.gc.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.gc:hover:not(.active){border-color:var(--accent);color:var(--accent)}
/* ── Record ── */
.rec-layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.class-list-item{padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--text2);transition:all .15s;border:1px solid transparent;display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.class-list-item:hover{background:var(--bg);color:var(--text)}
.class-list-item.active{background:var(--accent-lt);color:var(--accent);border-color:rgba(99,102,241,.2);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;opacity:0;transition:opacity .15s}
.class-list-item.has-prog .dot{opacity:1}
/* ── Form ── */
.fgroup{margin-bottom:16px}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.fctrl{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;transition:border-color .15s}
.fctrl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
select.fctrl{cursor:pointer}
textarea.fctrl{resize:vertical;min-height:80px}
/* ── Curriculum ── */
.unit-list{display:flex;flex-direction:column;gap:10px}
.unit-item{background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.unit-head{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.unit-head:hover{background:var(--bg)}
.unit-tw{display:flex;align-items:center;gap:10px}
.unit-num{width:26px;height:26px;background:var(--accent-lt);color:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.unit-title{font-size:14px;font-weight:600}
.unit-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.unit-item:hover .unit-acts{opacity:1}
.unit-lessons{border-top:1px solid var(--border);background:#fafafa}
.lesson-item{padding:9px 18px 9px 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-size:13px}
.lesson-item:last-child{border-bottom:none}
.lesson-item:hover{background:var(--accent-lt)}
.lesson-num{color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-right:8px;min-width:28px}
.lesson-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.lesson-item:hover .lesson-acts{opacity:1}
/* ── Compare table ── */
.cmp-table{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp-table th{background:#f8fafc;padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.5px}
.cmp-table td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.cmp-table tr:hover td{background:#fafbfc}
.cmp-table tr:last-child td{border-bottom:none}
.pmini{display:flex;align-items:center;gap:8px}
.pmini-bar{flex:1;background:#f1f5f9;border-radius:99px;height:8px;overflow:hidden}
.pmini-fill{height:100%;border-radius:99px;transition:width .5s ease}
/* ── History ── */
.hist-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-date{font-size:11.5px;font-family:'JetBrains Mono',monospace;color:var(--text3);white-space:nowrap;padding-top:2px;min-width:100px}
.hist-lesson{font-size:13.5px;font-weight:600}
.hist-unit{font-size:12px;color:var(--text3);margin-top:2px}
.hist-memo{font-size:12px;color:var(--text2);margin-top:5px;padding:4px 10px;background:#f8fafc;border-radius:6px;border-left:2px solid var(--accent)}
/* ── Section header ── */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sh-title{font-size:15px;font-weight:700}
.sh-sub{font-size:12px;color:var(--text3);margin-top:2px}
/* ── Modal ── */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:16px;width:460px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:700}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.btn-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
/* ── Toast ── */
.toast{position:fixed;bottom:22px;right:22px;background:#1e293b;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;transform:translateY(70px);opacity:0;transition:all .3s cubic-bezier(.34,1.4,.64,1)}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{background:#10b981}
.toast.err{background:#ef4444}
/* ── Empty ── */
.empty{text-align:center;padding:52px 20px;color:var(--text3)}
.empty-ico{font-size:38px;margin-bottom:10px}
/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
/* ── Print ── */
@media print{.sb,.topbar,.btn,.tb-acts{display:none!important}.main{margin-left:0}}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sb">
  <div class="sb-head">
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div>
        <div class="logo-name">수업 진도 관리</div>
        <div class="logo-sub">Class Progress Tracker</div>
      </div>
    </div>
  </div>
  <nav class="sb-nav">
    <div class="nav-section">
      <div class="nav-lbl">메인</div>
      <div class="nav-item active" data-v="dashboard" onclick="nav('dashboard')"><span class="nav-icon">📊</span>전체 현황</div>
      <div class="nav-item" data-v="record" onclick="nav('record')"><span class="nav-icon">✏️</span>진도 기록</div>
      <div class="nav-item" data-v="compare" onclick="nav('compare')"><span class="nav-icon">📈</span>학급 비교</div>
    </div>
    <div class="nav-section">
      <div class="nav-lbl">설정</div>
      <div class="nav-item" data-v="curriculum" onclick="nav('curriculum')"><span class="nav-icon">📋</span>커리큘럼</div>
      <div class="nav-item" data-v="classes" onclick="nav('classes')"><span class="nav-icon">🏫</span>학급 관리</div>
      <div class="nav-item" data-v="history" onclick="nav('history')"><span class="nav-icon">🕐</span>기록 조회</div>
    </div>
  </nav>
  <div class="sb-foot">LocalStorage 저장 중</div>
</aside>

<!-- Main -->
<main class="main">
  <header class="topbar">
    <div>
      <div class="tb-title" id="tb-title">전체 현황</div>
      <div class="tb-sub" id="tb-sub">학급별 수업 진도를 한눈에 확인하세요</div>
    </div>
    <div class="tb-acts" id="tb-acts"></div>
  </header>
  <div class="content">

    <!-- Dashboard -->
    <div id="v-dashboard" class="view active">
      <div class="stats-row" id="stats-row"></div>
      <div class="sh">
        <div><div class="sh-title">학급별 진도 현황</div></div>
        <div class="gf" id="gf"></div>
      </div>
      <div class="class-grid" id="class-grid"></div>
    </div>

    <!-- Record -->
    <div id="v-record" class="view">
      <div class="rec-layout">
        <div class="card">
          <div class="card-head"><div class="card-title">학급 선택</div></div>
          <div class="card-body" style="padding:12px" id="rec-list"></div>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title" id="rec-form-title">진도 기록</div></div>
          <div class="card-body" id="rec-form"></div>
        </div>
      </div>
    </div>

    <!-- Compare -->
    <div id="v-compare" class="view">
      <div id="cmp-content"></div>
    </div>

    <!-- Curriculum -->
    <div id="v-curriculum" class="view">
      <div class="sh">
        <div><div class="sh-title">커리큘럼 관리</div><div class="sh-sub">단원과 차시를 관리합니다</div></div>
        <button class="btn btn-primary" onclick="openModal('add-unit')">＋ 단원 추가</button>
      </div>
      <div class="unit-list" id="unit-list"></div>
    </div>

    <!-- Classes -->
    <div id="v-classes" class="view">
      <div class="sh">
        <div><div class="sh-title">학급 관리</div></div>
        <button class="btn btn-primary" onclick="openModal('add-class')">＋ 학급 추가</button>
      </div>
      <div id="cls-content"></div>
    </div>

    <!-- History -->
    <div id="v-history" class="view">
      <div class="card">
        <div class="card-head">
          <div class="card-title">기록 조회</div>
          <select class="fctrl" style="width:auto" id="hist-sel" onchange="renderHistory()"></select>
        </div>
        <div class="card-body" id="hist-body"></div>
      </div>
    </div>
  </div>
</main>

<!-- Modal -->
<div id="modal-back" class="modal-back" style="display:none" onclick="handleBack(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title"></div>
      <button class="btn-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
const KEY = 'cprogress_v3';

function defaults() {
  return {
    classes: [
      {id:'c1',grade:1,num:1},{id:'c2',grade:1,num:2},{id:'c3',grade:1,num:3},{id:'c4',grade:1,num:4},
      {id:'c5',grade:2,num:1},{id:'c6',grade:2,num:2},{id:'c7',grade:2,num:3},
      {id:'c8',grade:3,num:1},{id:'c9',grade:3,num:2},{id:'c10',grade:3,num:3},
    ],
    curriculum: [
      {id:'u1',title:'Ⅰ. 컴퓨팅 시스템',lessons:[
        {id:'l1a',title:'1차시: 컴퓨팅 시스템의 구성과 동작 원리'},
        {id:'l1b',title:'2차시: 피지컬 컴퓨팅 시스템의 이해'},
        {id:'l1c',title:'3차시: 운동 횟수 표시 장치 만들기'},
        {id:'l1d',title:'4차시: 수면 온도 알림이 장치 만들기'},
        {id:'l1e',title:'5차시: 소리에 반응하는 애니메이션 장치 만들기'},
        {id:'l1f',title:'6차시: 이심전심 게임 장치 만들기'},
        {id:'l1g',title:'7차시: 단원 평가'},
      ]},
      {id:'u2',title:'Ⅱ. 데이터',lessons:[
        {id:'l2a',title:'1차시: 디지털 형태의 데이터'},
        {id:'l2b',title:'2차시: 다양한 데이터의 디지털 표현'},
        {id:'l2c',title:'3차시: 데이터의 수집과 관리'},
        {id:'l2d',title:'4차시: 데이터의 구조화와 분석'},
        {id:'l2e',title:'5차시: 인기 공유 동영상 데이터 분석'},
        {id:'l2f',title:'6차시: 급식 전반 데이터 분석'},
        {id:'l2g',title:'7차시: 단원 평가'},
      ]},
      {id:'u3',title:'Ⅲ. 알고리즘과 프로그래밍',lessons:[
        {id:'l3a',title:'1차시: 문제의 상태와 구조화'},
        {id:'l3b',title:'2차시: 문제의 추상화'},
        {id:'l3c',title:'3차시: 알고리즘의 이해와 표현'},
        {id:'l3d',title:'4차시: 알고리즘의 분류와 설계'},
        {id:'l3e',title:'5차시: 프로그래밍 시작하기'},
        {id:'l3f',title:'6차시: 논리 연산 프로그래밍'},
        {id:'l3g',title:'7차시: 중첩 제어 구조 프로그래밍'},
        {id:'l3h',title:'8차시: 리스트와 프로그래밍'},
        {id:'l3i',title:'9차시: 함수와 디버깅'},
        {id:'l3j',title:'10차시: 실생활과 학문 분야 문제 해결'},
        {id:'l3k',title:'11차시: 단원 평가'},
      ]},
      {id:'u4',title:'Ⅳ. 인공지능',lessons:[
        {id:'l4a',title:'1차시: 인공지능의 개념과 특성'},
        {id:'l4b',title:'2차시: 데이터와 학습'},

let S = (() => {
  try {
    const r = localStorage.getItem(KEY);
    if (r) {
      const p = JSON.parse(r);
      const d = defaults();
      return { classes: p.classes||d.classes, curriculum: p.curriculum||d.curriculum,
               progress: p.progress||{}, history: p.history||{} };
    }
  } catch(e){}
  return defaults();
})();

function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

// ===== UTILS =====
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function cname(c) { return `${c.grade}학년 ${c.num}반`; }
function totalLessons() { return S.curriculum.reduce((n,u)=>n+u.lessons.length,0); }

function pct(cid) {
  const p = S.progress[cid];
  if (!p?.lessonId) return 0;
  let tot=0, found=-1;
  for (const u of S.curriculum)
    for (const l of u.lessons) {
      tot++;
      if (l.id === p.lessonId) found = tot;
    }
  return tot && found > -1 ? Math.round(found/tot*100) : 0;
}

function lessonInfo(uid2, lid) {
  for (const u of S.curriculum)
    if (u.id===uid2)
      for (const l of u.lessons)
        if (l.id===lid) return { unitTitle:u.title, lessonTitle:l.title };
  return null;
}

function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso), p = n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(()=>t.className='toast', 2800);
}

function nav(v) {

  ({dashboard:renderDashboard,record:renderRecord,compare:renderCompare,
    curriculum:renderCurriculum,classes:renderClasses,history:renderHistory})[v]?.();

// ===== DASHBOARD =====
function renderDashboard() {
  // Stats
  const total = S.classes.length;
  const withP = S.classes.filter(c=>S.progress[c.id]?.lessonId).length;
  const avg   = total ? Math.round(S.classes.reduce((s,c)=>s+pct(c.id),0)/total) : 0;
  document.getElementById('stats-row').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-lbl">전체 학급</div></div>
    <div class="stat"><div class="stat-num" style="color:#10b981">${withP}</div><div class="stat-lbl">기록된 학급</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--accent)">${avg}%</div><div class="stat-lbl">평균 진도율</div></div>
    <div class="stat"><div class="stat-num">${totalLessons()}</div><div class="stat-lbl">전체 차시</div></div>
  `;
  // Grade filter
  const grades = [...new Set(S.classes.map(c=>c.grade))].sort();
  document.getElementById('gf').innerHTML =
    `<button class="gc ${dashFilt==='all'?'active':''}" onclick="setFilt('all')">전체</button>`+
    grades.map(g=>`<button class="gc ${dashFilt==g?'active':''}" onclick="setFilt(${g})">${g}학년</button>`).join('');
  // Grid
  let cls = S.classes;
  if (dashFilt!=='all') cls = cls.filter(c=>c.grade==dashFilt);
  const el = document.getElementById('class-grid');
  if (!cls.length) { el.innerHTML='<div class="empty"><div class="empty-ico">🏫</div><p>표시할 학급 없음</p></div>'; return; }
  el.innerHTML = cls.map(c=>{
    const p=S.progress[c.id], pt=pct(c.id), info=p?lessonInfo(p.unitId,p.lessonId):null;
    const bClass = pt>=70?'badge-green':pt>=30?'badge-blue':'badge-amber';
    return `<div class="class-card" onclick="quickRec('${c.id}')">
      <div class="cc-head">
        <div class="cc-badge g${c.grade}">${c.grade}-${c.num}</div>
        ${pt>0?`<span class="badge ${bClass}">${pt}%</span>`:`<span class="badge badge-gray">미기록</span>`}
      </div>
      <div class="cc-body">
        <div class="cc-name">${cname(c)}</div>
        ${info?`
          <div class="prog-label"><span>진도</span><span>${pt}%</span></div>
          <div class="prog-wrap"><div class="prog-bar" style="width:${pt}%"></div></div>
          <div class="cc-lesson">${info.lessonTitle}</div>
          <div class="cc-unit">${info.unitTitle}</div>
          ${p.memo?`<div class="cc-memo">💬 ${p.memo}</div>`:''}
          <div class="cc-date">🕐 ${fmtDate(p.updatedAt)}</div>
        `:`<div class="no-prog">진도 미기록<br><small>클릭하여 기록하기</small></div>`}
      </div>
    </div>`;
  }).join('');
}

function setFilt(f) { dashFilt=f; renderDashboard(); }
function quickRec(id) { selCls=id; nav('record'); }

// ===== RECORD =====
function renderRecord() {
  document.getElementById('rec-list').innerHTML = S.classes.map(c=>`
    <div class="class-list-item ${selCls===c.id?'active':''} ${S.progress[c.id]?.lessonId?'has-prog':''}"
         onclick="selClass('${c.id}')">
      ${cname(c)}<div class="dot"></div>
    </div>`).join('');
  renderRecForm();
}

function selClass(id) { selCls=id; renderRecord(); }

function renderRecForm() {
  const ft = document.getElementById('rec-form-title');
  const fb = document.getElementById('rec-form');
  if (!selCls) {
    ft.textContent='진도 기록';
    fb.innerHTML='<div class="empty"><div class="empty-ico">👈</div><p>학급을 선택하세요</p></div>';
    return;
  }
  const c = S.classes.find(x=>x.id===selCls);
  const p = S.progress[selCls]||{};
  ft.textContent = `${cname(c)} 진도 기록`;
  const selUnit = p.unitId ? S.curriculum.find(u=>u.id===p.unitId) : S.curriculum[0];
  fb.innerHTML = `
    <div class="fgroup">
      <label class="flabel">단원</label>
      <select class="fctrl" id="f-unit" onchange="refreshLessons()">
        ${S.curriculum.map(u=>`<option value="${u.id}" ${p.unitId===u.id?'selected':''}>${u.title}</option>`).join('')}
      </select>
    </div>
    <div class="fgroup">
      <label class="flabel">차시</label>
      <select class="fctrl" id="f-lesson">
        ${(selUnit?.lessons||[]).map(l=>`<option value="${l.id}" ${p.lessonId===l.id?'selected':''}>${l.title}</option>`).join('')}
      </select>
    </div>
    <div class="fgroup">
      <label class="flabel">메모 <span style="font-weight:400;color:var(--text3)">(선택)</span></label>
      <textarea class="fctrl" id="f-memo" placeholder="수업 특이사항, 미진 내용 등">${p.memo||''}</textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      ${p.lessonId?`<button class="btn btn-ghost" onclick="clearProg()">초기화</button>`:''}
      <button class="btn btn-primary" onclick="saveProg()">💾 저장</button>
    </div>
    ${p.updatedAt?`<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--text3)">마지막 저장: ${fmtDate(p.updatedAt)}</div>`:''}
  `;
}

function refreshLessons() {
  const uid2 = document.getElementById('f-unit').value;
  const u = S.curriculum.find(x=>x.id===uid2);
  document.getElementById('f-lesson').innerHTML =
    (u?.lessons||[]).map(l=>`<option value="${l.id}">${l.title}</option>`).join('');
}

function saveProg() {
  const uid2  = document.getElementById('f-unit')?.value;
  const lid   = document.getElementById('f-lesson')?.value;
  const memo  = document.getElementById('f-memo')?.value.trim()||'';
  if (!uid2||!lid) { toast('단원과 차시를 선택하세요','err'); return; }
  S.progress[selCls] = { unitId:uid2, lessonId:lid, memo, updatedAt:new Date().toISOString() };
  if (!S.history[selCls]) S.history[selCls]=[];
  S.history[selCls].unshift({ id:uid(), unitId:uid2, lessonId:lid, memo, recordedAt:new Date().toISOString() });
  save();
  toast(`${cname(S.classes.find(c=>c.id===selCls))} 저장 완료`,'ok');
  renderRecord();
}

function clearProg() {
  if (!confirm('진도 기록을 초기화하시겠습니까?')) return;
  delete S.progress[selCls]; save();
  toast('초기화되었습니다'); renderRecord();
}

function toggleUnit(id) {
  const el=document.getElementById(`ul-${id}`), ico=document.getElementById(`utog-${id}`);
  const hide=el.style.display==='none'; el.style.display=hide?'':'none'; ico.textContent=hide?'▼':'▶';

function delUnit(id) {
  if (!confirm('단원을 삭제하시겠습니까?')) return;
  S.curriculum=S.curriculum.filter(u=>u.id!==id); save(); toast('삭제되었습니다'); renderCurriculum();
}
function delLesson(uid2,lid) {
  if (!confirm('차시를 삭제하시겠습니까?')) return;
  const u=S.curriculum.find(x=>x.id===uid2); if(u) u.lessons=u.lessons.filter(l=>l.id!==lid);
  save(); toast('삭제되었습니다'); renderCurriculum();
}

let mType='', mCtx=[];

function openModal(type, ...args) {
  mType=type; mCtx=args;
  const t=document.getElementById('modal-title');
  const b=document.getElementById('modal-body');
  const f=document.getElementById('modal-foot');
  document.getElementById('modal-back').style.display='flex';

  if (type==='add-unit') {
    t.textContent='단원 추가';
    b.innerHTML=`<div class="fgroup"><label class="flabel">단원명</label><input class="fctrl" id="mi1" placeholder="예: 1단원. 정보와 사회" autofocus></div>`;
  } else if (type==='edit-unit') {
    const u=S.curriculum.find(x=>x.id===args[0]);
    t.textContent='단원 수정';
    b.innerHTML=`<div class="fgroup"><label class="flabel">단원명</label><input class="fctrl" id="mi1" value="${u?.title||''}" autofocus></div>`;
  } else if (type==='add-lesson') {
    const u=S.curriculum.find(x=>x.id===args[0]);
    t.textContent='차시 추가';
    b.innerHTML=`<div style="margin-bottom:14px;padding:9px 12px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--text2)">📂 ${u?.title}</div>
      <div class="fgroup"><label class="flabel">차시명</label><input class="fctrl" id="mi1" placeholder="예: 1차시: 수업 주제" autofocus></div>`;
  } else if (type==='edit-lesson') {
    const u=S.curriculum.find(x=>x.id===args[1]);
    const l=u?.lessons.find(x=>x.id===args[0]);
    t.textContent='차시 수정';
    b.innerHTML=`<div class="fgroup"><label class="flabel">차시명</label><input class="fctrl" id="mi1" value="${l?.title||''}" autofocus></div>`;
  } else if (type==='add-class') {
    t.textContent='학급 추가';
    b.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="fgroup" style="margin:0"><label class="flabel">학년</label>
        <select class="fctrl" id="mg">${[1,2,3].map(g=>`<option value="${g}">${g}학년</option>`).join('')}</select></div>
      <div class="fgroup" style="margin:0"><label class="flabel">반</label>
        <select class="fctrl" id="mn">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}반</option>`).join('')}</select></div>
    </div>`;
  }

  f.innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">취소</button>
    <button class="btn btn-primary" onclick="confirmModal()">확인</button>`;
  setTimeout(()=>document.getElementById('mi1')?.focus(),50);
  b.onkeydown = e=>{ if(e.key==='Enter'&&!e.shiftKey) confirmModal(); };
}

function confirmModal() {
  if (mType==='add-unit') {
    const v=document.getElementById('mi1').value.trim();
    if (!v) { toast('단원명 입력','err'); return; }
    S.curriculum.push({id:uid(),title:v,lessons:[]}); save(); toast('단원 추가','ok'); closeModal(); renderCurriculum();
  } else if (mType==='edit-unit') {
    const v=document.getElementById('mi1').value.trim();
    if (!v) { toast('단원명 입력','err'); return; }
    const u=S.curriculum.find(x=>x.id===mCtx[0]); if(u) u.title=v; save(); toast('수정됨','ok'); closeModal(); renderCurriculum();
  } else if (mType==='add-lesson') {
    const v=document.getElementById('mi1').value.trim();
    if (!v) { toast('차시명 입력','err'); return; }
    const u=S.curriculum.find(x=>x.id===mCtx[0]); if(u) u.lessons.push({id:uid(),title:v});
    save(); toast('차시 추가','ok'); closeModal(); renderCurriculum();
  } else if (mType==='edit-lesson') {
    const v=document.getElementById('mi1').value.trim();
    if (!v) { toast('차시명 입력','err'); return; }
    const u=S.curriculum.find(x=>x.id===mCtx[1]);
    const l=u?.lessons.find(x=>x.id===mCtx[0]); if(l) l.title=v;
    save(); toast('수정됨','ok'); closeModal(); renderCurriculum();
  } else if (mType==='add-class') {
    const g=parseInt(document.getElementById('mg').value);
    const n=parseInt(document.getElementById('mn').value);
    if (S.classes.find(c=>c.grade===g&&c.num===n)) { toast('이미 존재하는 학급','err'); return; }
    S.classes.push({id:uid(),grade:g,num:n});
    S.classes.sort((a,b)=>a.grade!==b.grade?a.grade-b.grade:a.num-b.num);
    save(); toast(`${g}학년 ${n}반 추가`,'ok'); closeModal(); renderClasses();
  }
}

function closeModal() { document.getElementById('modal-back').style.display='none'; mType=''; mCtx=[]; }
function handleBack(e) { if(e.target===document.getElementById('modal-back')) closeModal(); }

// ===== EXPORT =====
function exportCSV() {
  const rows = [['학급','단원','차시','진도율','최근업데이트','메모']];
  S.classes.forEach(c=>{
    const p=S.progress[c.id], info=p?lessonInfo(p.unitId,p.lessonId):null;
    rows.push([cname(c), info?.unitTitle||'', info?.lessonTitle||'', pct(c.id)+'%',
               p?.updatedAt?fmtDate(p.updatedAt):'', p?.memo||'']);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=Object.assign(document.createElement('a'),{
    href: URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'})),
    download: `진도현황_${new Date().toISOString().slice(0,10)}.csv`
  });
  a.click(); toast('CSV 저장됨','ok');
}

// ===== INIT =====
renderDashboard();
